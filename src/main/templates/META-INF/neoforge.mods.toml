modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MisterFossil/Structures-Are-Not-Spawners/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="LaLuaCreatura"
description='''
Pillager outposts and ocean monuments stop respawning enemies after you kill enough of them.
Built-in compatibility with Repurposed Structures, Terralith and Towns and Towers.

Fully configurable – check mod settings.
'''
logoFile="icon.png"
displayURL="https://github.com/MisterFossil/Structures-Are-Not-Spawners"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
